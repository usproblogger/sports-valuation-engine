<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start Your Project — AI Intake Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    .container {
      width: 100%; max-width: 600px; background: var(--card);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 6px; font-size: 1.5rem; }
    p.sub { margin: 0 0 18px; color: var(--muted); font-size: 0.94rem; line-height: 1.5; }
    .voice-toggle {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.84rem;
      color: var(--muted); margin-bottom: 14px; cursor: pointer;
    }
    .messages {
      height: 330px; overflow-y: auto; display: flex; flex-direction: column;
      gap: 12px; padding: 12px; background: #0f172a;
      border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px;
    }
    .msg {
      max-width: 85%; padding: 12px 15px; border-radius: 12px;
      font-size: 0.94rem; line-height: 1.45;
    }
    .msg.ai { background: #1e293b; border: 1px solid var(--border); align-self: flex-start; }
    .msg.user { background: var(--accent); color: white; align-self: flex-end; }
    .quick-options {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
    }
    .option-btn {
      padding: 9px 14px; border-radius: 999px; border: 1px solid var(--accent);
      background: rgba(59, 130, 246, 0.14); color: #93c5fd;
      font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: 0.15s;
    }
    .option-btn:hover {
      background: var(--accent); color: white;
    }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: #0f172a; color: var(--text); font-size: 0.95rem; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button.action {
      padding: 0 16px; border-radius: 10px; border: none; font-weight: 600;
      cursor: pointer; background: var(--accent); color: white; transition: 0.15s;
    }
    button.action:hover { background: var(--accent-hover); }
    button.mic { background: #334155; font-size: 1.1rem; }
    button.mic.listening { background: #ef4444; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: 0.6; } }
  </style>
</head>
<body>

<div class="container">
  <h1>Tell Us About Your Project</h1>
  <p class="sub">Answer 5 quick questions by tapping, typing, or using your microphone—your project brief goes straight to our developer.</p>

  <label class="voice-toggle">
    <input type="checkbox" id="tts-toggle" /> Read AI questions aloud
  </label>

  <div class="messages" id="messages"></div>

  <div class="quick-options" id="quick-options" style="display: none;"></div>

  <div class="input-row" id="input-controls">
    <button class="action mic" id="mic-btn" title="Speak answer" onclick="toggleMic()">🎤</button>
    <input type="text" id="user-input" placeholder="Type or tap mic to speak..." onkeydown="if(event.key==='Enter') sendAnswer()" />
    <button class="action" onclick="sendAnswer()">Send</button>
  </div>
</div>

<script>
  const WEB3FORMS_KEY = "7393fec3-3022-4eea-bdef-224842265d47";

  const STEPS = [
    {
      key: "objective",
      question: "Hi there! In your own words, what are you hoping to build or get done on the web?"
    },
    {
      key: "project_type",
      question: "Got it. Is this a new project, an existing project, or something you need to troubleshoot?",
      options: ["New Project", "Existing Project", "Troubleshoot"]
    },
    {
      key: "constraints",
      question: "Do you have a target launch timeline or rough budget range in mind?"
    },
    {
      key: "materials",
      question: "Do you already have a domain, branding, or example sites you like, or are we starting from scratch?"
    },
    {
      key: "contact",
      question: "Last step—what is your name and best email address so our developer can follow up with you?"
    }
  ];

  let currentStep = 0;
  let answers = {};

  function renderOptions(step) {
    const optContainer = document.getElementById("quick-options");
    optContainer.innerHTML = "";
    if (step && step.options && step.options.length > 0) {
      step.options.forEach(label => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.textContent = label;
        btn.onclick = () => submitValue(label);
        optContainer.appendChild(btn);
      });
      optContainer.style.display = "flex";
    } else {
      optContainer.style.display = "none";
    }
  }

  function addMessage(text, sender) {
    const box = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `msg ${sender}`;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;

    if (sender === "ai" && document.getElementById("tts-toggle").checked && "speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    }
  }

  async function submitValue(val) {
    if (!val) return;
    document.getElementById("quick-options").style.display = "none";

    addMessage(val, "user");
    answers[STEPS[currentStep].key] = val;
    document.getElementById("user-input").value = "";
    currentStep++;

    if (currentStep < STEPS.length) {
      setTimeout(() => {
        addMessage(STEPS[currentStep].question, "ai");
        renderOptions(STEPS[currentStep]);
      }, 350);
    } else {
      document.getElementById("input-controls").style.display = "none";
      addMessage("Thanks! Packaging your project brief and sending it to our developer now...", "ai");
      await submitToEmail();
    }
  }

  function sendAnswer() {
    const input = document.getElementById("user-input");
    submitValue(input.value.trim());
  }

  async function submitToEmail() {
    const payload = {
      access_key: WEB3FORMS_KEY,
      subject: `New Web Dev Inquiry [${answers.project_type || "Project"}] — ${answers.contact || "New Lead"}`,
      from_name: "AI Project Intake",
      "1_Core_Objective": answers.objective,
      "2_Project_Type": answers.project_type,
      "3_Timeline_and_Budget": answers.constraints,
      "4_Existing_Materials": answers.materials,
      "5_Client_Contact": answers.contact
    };

    try {
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success) {
        addMessage("✅ All sent! Your project details are in our developer's inbox. Expect a reply soon.", "ai");
      } else {
        addMessage("⚠️ Something went wrong sending the form. Please verify your Web3Forms key.", "ai");
      }
    } catch (err) {
      addMessage("⚠️ Network error while sending. Please refresh and try again.", "ai");
    }
  }

  // Browser Speech-to-Text
  let recognition = null;
  let isListening = false;
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      submitValue(event.results[0][0].transcript);
    };
    recognition.onend = () => {
      isListening = false;
      document.getElementById("mic-btn").classList.remove("listening");
    };
  }

  function toggleMic() {
    if (!recognition) {
      alert("Voice input isn't supported in this browser—please type your answer instead.");
      return;
    }
    if (isListening) {
      recognition.stop();
    } else {
      isListening = true;
      document.getElementById("mic-btn").classList.add("listening");
      recognition.start();
    }
  }

  // Start immediately on page load
  window.addEventListener("DOMContentLoaded", () => {
    addMessage(STEPS[0].question, "ai");
    renderOptions(STEPS[0]);
    document.getElementById("user-input").focus();
  });
</script>
</body>
</html>
